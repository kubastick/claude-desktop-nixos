# Weekly check for a new Claude Desktop release in Anthropic's apt repo.
# If sources.json changes, build the package and open (or refresh) a PR.
name: Update claude-desktop

on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/update.yml
      - update.sh
  pull_request:
    paths:
      - .github/workflows/update.yml
      - update.sh

permissions: {}

concurrency:
  group: update-claude-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      old: ${{ steps.update.outputs.old }}
      new: ${{ steps.update.outputs.new }}
      sources: ${{ steps.update.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for a new version
        id: update
        run: |
          old=$(jq -r .version sources.json)
          ./update.sh
          new=$(jq -r .version sources.json)

          if ! [[ $new =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unexpected version string from apt index: $new"
            exit 1
          fi

          {
            echo "old=$old"
            echo "new=$new"
            echo "sources=$(jq -c . sources.json)"
          } >> "$GITHUB_OUTPUT"

          if git diff --quiet -- sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "claude-desktop is up to date ($old)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.update.outputs.changed == 'true' || github.event_name == 'pull_request'
        run: |
          nix build --print-build-logs .#claude-desktop
          nix flake check --no-build
          nix eval .#packages.aarch64-linux.claude-desktop.drvPath

  pull-request:
    needs: check
    if: needs.check.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: update/claude-desktop
      OLD: ${{ needs.check.outputs.old }}
      NEW: ${{ needs.check.outputs.new }}
      SOURCES: ${{ needs.check.outputs.sources }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          jq . <<<"$SOURCES" > sources.json
          git add sources.json
          git commit -m "claude-desktop: $OLD -> $NEW"
          git push --force origin "$BRANCH"

      - name: Open or update PR
        run: |
          title="claude-desktop: $OLD -> $NEW"
          body=$(cat <<EOF
          Automated update from Anthropic's apt repository
          (\`https://downloads.claude.ai/claude-desktop/apt/stable\`).

          - \`sources.json\` regenerated by \`./update.sh\`
          - x86_64-linux package built successfully in CI
          - aarch64-linux evaluated only (not built)

          Smoke-test locally before merging:
          \`nix run github:$GITHUB_REPOSITORY/$BRANCH\`
          EOF
          )

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "$title" --body "$body"
          fi
